<!doctype html>
<html><head><meta charset="utf-8"><title>Orbit</title>
<style>
  @font-face{font-family:'Unbounded';src:url(fonts/Unbounded.ttf) format('truetype');font-weight:200 900}
  @font-face{font-family:'Space Grotesk';src:url(fonts/SpaceGrotesk.ttf) format('truetype');font-weight:300 700}
  @font-face{font-family:'Space Mono';src:url(fonts/SpaceMono-Regular.ttf) format('truetype');font-weight:400}
  @font-face{font-family:'Space Mono';src:url(fonts/SpaceMono-Bold.ttf) format('truetype');font-weight:700}
  :root{--accent:#3df2ff}
  html,body{margin:0;background:#03101a;overflow:hidden;width:100%;height:100%;font-family:'Space Grotesk',sans-serif}
  #bg{display:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;z-index:1}
  .hud{position:fixed;z-index:2;color:#fff}
  #host{left:48px;top:34px;max-width:44%;font-family:'Unbounded',sans-serif;font-weight:600;font-size:30px;line-height:1.18;letter-spacing:-.01em;
        background:linear-gradient(100deg,#fff 55%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
        filter:drop-shadow(0 2px 18px rgba(0,0,0,.7))}
  #meta{right:48px;top:36px;font-family:'Space Mono',monospace;font-weight:700;font-size:17px;letter-spacing:.38em;color:var(--accent);text-shadow:0 0 18px rgba(0,0,0,.6)}
  #skyline,#wellline{right:48px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.18em;opacity:.72;text-shadow:0 1px 10px rgba(0,0,0,.7)}
  #skyline{top:70px;color:var(--accent)}
  #wellline{top:94px;color:#fff;opacity:.55}
  #rule{position:fixed;left:50%;bottom:112px;height:2px;width:0;background:var(--accent);z-index:2;transform:translateX(-50%);box-shadow:0 0 14px var(--accent);transition:width .45s cubic-bezier(.2,.9,.2,1)}
  #rule.on{width:220px}
  #label{left:0;right:0;bottom:46px;text-align:center;font-family:'Unbounded',sans-serif;font-weight:700;font-size:44px;letter-spacing:-.02em;text-shadow:0 0 28px rgba(0,0,0,.8),0 0 60px var(--accent);transition:transform .32s cubic-bezier(.2,.9,.2,1.2),opacity .32s}
  #label.pop{transform:translateY(14px) scale(.96);opacity:0;transition:none}
  #sub{left:0;right:0;bottom:20px;text-align:center;font-family:'Space Mono',monospace;font-size:15px;letter-spacing:.22em;text-transform:uppercase;opacity:.7;text-shadow:0 1px 10px rgba(0,0,0,.8)}
  #veil{position:fixed;inset:0;z-index:3;background:#03101a;opacity:1;transition:opacity .6s}
  #fps{position:fixed;left:48px;bottom:14px;z-index:2;font-family:'Space Mono',monospace;font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.2em}
  #dusk{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,rgba(60,30,0,0) 40%,rgba(40,15,0,.55) 100%);opacity:0;transition:opacity 2s}
  body.winddown #dusk{opacity:1}
  body.dream #host{font-size:150px;line-height:1;max-width:none;top:60px;font-weight:700;letter-spacing:-.04em;-webkit-text-fill-color:#fff;color:#fff;background:none}
  body.dream #meta{top:236px;right:auto;left:52px;font-size:16px;letter-spacing:.4em;color:rgba(255,255,255,.7)}
  body.dream #skyline{top:270px;right:auto;left:52px}
  body.dream #wellline,body.dream #fps{display:none}
</style></head>
<body>
<div id="bg"></div>
<canvas id="gl"></canvas>
<div id="host" class="hud"></div>
<div id="meta" class="hud"></div>
<div id="skyline" class="hud"></div>
<div id="wellline" class="hud"></div>
<div id="dusk"></div>
<div id="rule"></div>
<div id="label" class="hud"></div>
<div id="sub" class="hud"></div>
<div id="fps"></div>
<div id="veil"></div>
<script src="lib/three.min.js"></script>
<script src="profiles.js"></script>
<script src="sky.js"></script>
<script src="world.js"></script>
<script src="orbit.js"></script>
</body></html>
